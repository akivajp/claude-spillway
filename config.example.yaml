# Example configuration for claude-spillway.
# Copy it with `cp config.example.yaml config.yaml`, edit it, and start the
# proxy with `claude-spillway serve -c config.yaml`.
# ${ENV_VAR} placeholders are expanded from the environment, so API keys need
# not be written into this file.
#
# claude-spillway 設定ファイルの例。
# `cp config.example.yaml config.yaml` してから編集し、
# `claude-spillway serve -c config.yaml` で起動してください。
# ${ENV_VAR} の形式で環境変数を埋め込めます(APIキーの直書き回避)。

listen:
  host: 127.0.0.1
  port: 8787

anthropic:
  # Whatever auth header Claude Code sends (x-api-key or an OAuth bearer
  # token) is forwarded as-is, so no Anthropic credential belongs here.
  # Claude Codeが送ってくる認証ヘッダー(x-api-key または OAuthのBearerトークン)を
  # そのまま横流しするだけなので、ここにAnthropicの資格情報を書く必要はありません。
  base_url: https://api.anthropic.com

ollama:
  base_url: https://ollama.com
  # Ollama Cloud API key. Issue one at https://ollama.com/settings/keys .
  # Ollama CloudのAPIキー。 https://ollama.com/settings/keys で発行してください。
  api_key: ${OLLAMA_API_KEY}
  # Value of the __Secure-session cookie from a browser signed in to ollama.com
  # (optional). The quota (%) and reset times are only shown on the account's
  # settings page, so without this the Ollama quota stays unknown. Expires
  # roughly 90 days after sign-in.
  # ollama.comにログインしたブラウザの __Secure-session Cookieの値(任意)。
  # quota(%)とリセット時刻はアカウントの設定ページにしか表示されないため、
  # 未設定だとOllama側のquotaは不明のままになる。ログインから約90日で失効する。
  session_cookie: ${OLLAMA_SESSION_COOKIE}
  # How often to read that settings page, in seconds.
  # 設定ページを読みに行く間隔(秒)
  usage_page_interval_seconds: 120

quota:
  # Fail over to Ollama Cloud once the remaining quota drops below this %.
  # 残量がこの%を下回ったらOllama Cloudへフェイルオーバーする
  fallback_threshold_pct: 10.0
  # Switch back to Anthropic at this % (hysteresis, to avoid flapping).
  # 残量がこの%まで回復したらAnthropicへ切り戻す(フラッピング防止のヒステリシス)
  recovery_threshold_pct: 20.0
  # How often the background probe refreshes the quota reading (seconds).
  # バックグラウンドプローブがquotaを再取得する間隔(秒)
  probe_interval_seconds: 60.0
  # Read quota from the OAuth usage endpoint, which consumes none. It is the
  # endpoint Claude Code reads for its own /usage, and it also supplies the
  # reset time of each window. Subscription (OAuth) auth only: with an API key
  # the proxy falls back to the rate-limit headers of relayed responses, and to
  # the probe below while in fallback. Set false to never call it.
  # quotaを消費しないOAuth使用量エンドポイントから残量を読む。Claude Code自身が
  # /usage で参照しているエンドポイントで、各ウィンドウのリセット時刻もここから
  # 取得できる。サブスクリプション(OAuth)認証専用で、APIキー課金の場合は中継した
  # レスポンスのヘッダーに、フォールバック中は下記プローブに切り替わる。
  # 呼びたくない場合は false にする。
  use_usage_endpoint: true
  # Fallback probe, used only when the usage endpoint is unavailable AND we are
  # in fallback. Unlike the usage endpoint this does consume a little quota, so
  # keep max_tokens minimal.
  # 使用量エンドポイントが使えず、かつフォールバック中の場合にのみ使うプローブ。
  # 使用量エンドポイントと違いわずかにquotaを消費するため max_tokens は最小にする。
  probe_max_tokens: 1
  probe_model: claude-haiku-4-5-20251001

routing:
  # How to choose between the backends while neither is critical.
  #   anthropic_first   : stay on Anthropic until it runs low (the default)
  #   weekly_balance    : while both short windows are comfortable, prefer the
  #                       side with more of its weekly window left
  #   burn_rate_balance : prefer the side that can serve longest relative to how
  #                       long is left in its windows; use this as a safety valve
  #                       when one side is burning quota faster than its reset
  #                       will allow
  # どちらも逼迫していない状況でのバックエンドの選び方。
  #   anthropic_first   : Anthropicが逼迫するまで使い続ける(デフォルト)
  #   weekly_balance    : 短い窓が両方とも余裕のある間は、週次窓の残量が多い方を優先
  #   burn_rate_balance : 窓の残り時間に対してどちらが長く捌けるかを比較し、
  #                       リセットまでに使い切りそうな側を避ける安全弁として使う
  policy: anthropic_first

  # Never fail over into an Ollama account that is itself nearly out of quota.
  # Ollama側の残量がこの%を下回ったら、フェイルオーバー先として使わない。
  ollama_min_remaining_pct: 5.0
  # weekly_balance only engages while both short windows hold at least this much.
  # weekly_balance は、短い窓が両方ともこの%以上残っている間だけ働く。
  balance_session_floor_pct: 50.0
  # ...and only switches if the other side is ahead by this much (hysteresis).
  # かつ相手側がこの%以上優っている場合のみ切り替える(ヒステリシス)。
  balance_margin_pct: 10.0
  # burn_rate_balance: how much to favour Anthropic when comparing the two
  # sides' ability to serve until their windows reset. 1.0 is neutral; 1.1
  # means Anthropic needs to be ~9% worse before traffic moves off it.
  # burn_rate_balance: 窓のリセットまでにどちらが長く捌けるかを比較する際の
  # Anthropic側の優先度。1.0なら同等扱い。1.1ならAnthropicが約9%劣るまで
  # トラフィックを移さない。
  anthropic_priority_weight: 1.1

  # Reverse failover: Ollama Cloud can get slow or fail outright when a model is
  # busy, so after this many consecutive failures go back to Anthropic - but only
  # if its 5h window still has room to serve, and leave Ollama alone for a while.
  # 逆フェイルオーバー: Ollama Cloudは特定モデルへのアクセス集中時に遅延・失敗する
  # ことがあるため、連続でこの回数失敗したらAnthropicへ戻す。ただしAnthropicの
  # 5時間窓に捌けるだけの残量がある場合に限り、戻した後は一定時間Ollamaを使わない。
  ollama_failure_threshold: 5
  reverse_failover_min_5h_pct: 10.0
  reverse_failover_cooldown_seconds: 300.0

# Model names that exist on Ollama Cloud but not at Anthropic.
# Failover routes by quota; this routes by name. Claude Code validates a model
# by actually sending it, so relaying such a name to Anthropic produces the 404
# it reports as "model not found". Sending it straight to Ollama instead makes
# the name selectable from /model and keeps it working while Anthropic quota is
# perfectly healthy.
#
# Ollama Cloudには存在し、Anthropicには存在しないモデル名の扱い。
# フェイルオーバーがquotaで行き先を決めるのに対し、こちらは名前で決める。
# Claude Codeはモデル名の検証を「実際に送ってみる」ことで行うため、そうした名前を
# Anthropicへ中継すると404になり、「モデルが見つからない」と報告される。Ollamaへ
# 直接送ることで /model から選べるようになり、Anthropicのquotaに余裕がある間も
# 使い続けられる。
direct_models:
  # Route by model name regardless of quota. false で従来どおりquotaのみで判断。
  enabled: true
  # Learn the names from Ollama Cloud's own listing (GET /api/tags). That read
  # is not counted as a request, the same way the usage endpoint is not.
  # Ollama Cloud自身の一覧(GET /api/tags)から名前を取得する。この読み取りは
  # 使用量エンドポイントと同様、リクエスト数には計上されない。
  discover: true
  refresh_interval_seconds: 3600.0
  # Names treated as direct on top of the discovered ones.
  # 取得した一覧に加えて直結対象として扱う名前。
  extra: []
  # Claude Code asks Anthropic to count tokens for whichever model is selected,
  # and Anthropic 404s on a name it does not know, leaving the context meter
  # blind. For a direct-routed model the request is relayed with the model
  # swapped for this one - an approximate count from a different tokenizer
  # beats none. Ollama is never asked: its shim is unstable for this endpoint.
  # Set to "" to relay the request untouched.
  # Claude Codeは選択中のモデル名でAnthropicにトークン数を問い合わせるが、
  # Anthropicは知らない名前に404を返し、コンテキスト残量の表示が盲目になる。
  # 直結対象のモデルでは、モデル名をこの値に差し替えて中継する(別トークナイザに
  # よる概算でも、何も得られないよりはよい)。Ollamaへは投げない(互換シムが
  # このエンドポイントで不安定なため)。"" にすると書き換えずそのまま中継する。
  count_tokens_stand_in: claude-sonnet-5

  # Used by `claude-spillway models --sync-picker`, which writes the modelPicker
  # key of Claude Code's settings file so these models appear in /model. Only
  # that key is touched; the model you then pick is saved by Claude Code itself
  # into the "model" key of the same file, and restored on the next launch.
  #
  # `claude-spillway models --sync-picker` が使う設定。Claude Codeの設定ファイルの
  # modelPicker キーを書き換え、これらのモデルが /model に出るようにする。触るのは
  # そのキーのみ。選択したモデルはClaude Code自身が同じファイルの "model" キーへ
  # 保存し、次回起動時に復元する。
  picker:
    # Must be the user (or managed) settings file: Claude Code ignores this key
    # in project-level settings.
    # ユーザー設定(またはmanaged設定)のファイルであること。プロジェクト設定に
    # 書いてもClaude Codeはこのキーを読まない。
    settings_path: ~/.claude/settings.json
    # The Anthropic model whose client-side handling (prompt profile,
    # capabilities, effort defaults) Claude Code applies to these rows.
    # REQUIRED in practice: without it Claude Code does not offer a row at all
    # for a model the running version has no catalog entry for.
    # これらの行に対してClaude Codeが流用する、クライアント側の扱い
    # (プロンプトプロファイル、能力、effort既定値)の元となるAnthropicモデル。
    # 実質必須。これが無いと、動作中のバージョンがカタログを持たないモデルの行は
    # そもそもピッカーに出てこない。
    behaves_as: claude-sonnet-5
    # {base} = the name Ollama lists, {model} = the name written into the row.
    # {base} = Ollamaが返す名前、{model} = 行に書き出す名前。
    label_template: "{base} (Ollama Cloud)"
    description_template: "Ollama Cloud · routed directly by claude-spillway"
    # Write glm-5.3-flash:cloud rather than glm-5.3-flash. Both work.
    # glm-5.3-flash ではなく glm-5.3-flash:cloud と書き出す。どちらでも動く。
    use_cloud_suffix: true
    # true hides the built-in Claude lineup from /model. Rarely what you want.
    # true にすると /model から組み込みのClaudeモデルが消える。通常は不要。
    replace_built_in_options: false
    # fnmatch patterns over the names Ollama lists. Empty include = all.
    # `models --sync-picker --pick` (interactive) and `models --include/-exclude`
    # (repeatable or comma-separated) override these without editing this file.
    # Ollamaが返す名前に対する fnmatch パターン。include が空なら全件。
    # `models --sync-picker --pick`(対話選択)や `models --include/--exclude`
    # (繰り返し・カンマ区切り可)で、このファイルを編集せずに上書きできる。
    include: []
    exclude: []
    # fnmatch patterns whose rows get Claude Code's [1m] marker, so it manages a
    # 1M-token context instead of the 200k it assumes from behaves_as. The proxy
    # strips the marker before the request leaves for Ollama. Empty by default:
    # this asserts a window the listing does not report, and claiming one the
    # model lacks makes Claude Code overfill the context instead of compacting.
    # e.g. glm-5.3-flash serves 1M.
    # 行にClaude Codeの [1m] 印を付ける fnmatch パターン。behaves_as から推定される
    # 200kではなく、1Mトークンのコンテキストとして管理させる。印はOllamaへ送出する
    # 直前にプロキシが取り除く。既定は空。一覧からは得られない窓長を主張するもので
    # あり、実際には無い窓長を主張するとClaude Codeが圧縮せずに詰め込んでしまう。
    # 例: glm-5.3-flash は1M。
    extended_context: []
      # - "glm-5.3-flash"
    # Per-model overrides. The first rule whose "match" hits is used.
    # モデル単位の上書き。"match" が最初に一致したルールが使われる。
    overrides: []
      # - match: "glm-*"
      #   label: "GLM 5.3 Flash"
      #   behaves_as: claude-opus-5

# Anthropic model name -> the Ollama Cloud model used during failover.
# The `target` value is sent verbatim as the "model" field of the Ollama API,
# so it must be exactly a tag listed on ollama.com/library (adding a custom
# suffix such as [1m] makes the model unresolvable and the request fails).
# Context lengths are noted in comments only; they are not part of the value.
# Every target MUST be a tool-calling model: Claude Code is an agent and cannot
# work with a model that does not support tool use. Verify with a probe request
# before adding one here (see docs/wsl-windows.md, "Choosing a fallback model").
#
# Anthropicのモデル名 -> フェイルオーバー時に使うOllama Cloud側のモデル名。
# target の値はOllama CloudのAPIへ "model" フィールドとしてそのまま送られるため、
# ollama.com/library に載っている正式なタグ名を過不足なく指定すること
# ([1m] 等の独自サフィックスを付けるとモデルが見つからずエラーになる)。
# コンテキスト長はコメントとして注記しておく(値には含めない)。
# target には必ずtool calling対応モデルを指定すること。Claude Codeはエージェントであり、
# ツール呼び出しができないモデルでは機能しない。追加前に実際にリクエストを投げて
# 確認すること(docs/wsl-windows.ja.md の「フォールバック先モデルの選定」を参照)。
model_mapping:
  default: glm-5.3-flash:cloud  # 1M tokens / 1Mトークン
  rules:
    - match: "claude-opus-*"
      target: glm-5.3-flash:cloud  # 1M tokens / 1Mトークン
    - match: "claude-sonnet-*"
      target: glm-5.3-flash:cloud  # 1M tokens / 1Mトークン
    - match: "claude-haiku-*"
      target: gemma4:31b-cloud  # 256K tokens / 256Kトークン

log_level: INFO
