# Example configuration for claude-spillway.
# Copy it with `cp config.example.yaml config.yaml`, edit it, and start the
# proxy with `claude-spillway serve -c config.yaml`.
# ${ENV_VAR} placeholders are expanded from the environment, so API keys need
# not be written into this file.
#
# claude-spillway 設定ファイルの例。
# `cp config.example.yaml config.yaml` してから編集し、
# `claude-spillway serve -c config.yaml` で起動してください。
# ${ENV_VAR} の形式で環境変数を埋め込めます(APIキーの直書き回避)。

listen:
  host: 127.0.0.1
  port: 8787

anthropic:
  # Whatever auth header Claude Code sends (x-api-key or an OAuth bearer
  # token) is forwarded as-is, so no Anthropic credential belongs here.
  # Claude Codeが送ってくる認証ヘッダー(x-api-key または OAuthのBearerトークン)を
  # そのまま横流しするだけなので、ここにAnthropicの資格情報を書く必要はありません。
  base_url: https://api.anthropic.com

ollama:
  base_url: https://ollama.com
  # Ollama Cloud API key. Issue one at https://ollama.com/settings/keys .
  # Ollama CloudのAPIキー。 https://ollama.com/settings/keys で発行してください。
  api_key: ${OLLAMA_API_KEY}

quota:
  # Fail over to Ollama Cloud once the remaining quota drops below this %.
  # 残量がこの%を下回ったらOllama Cloudへフェイルオーバーする
  fallback_threshold_pct: 10.0
  # Switch back to Anthropic at this % (hysteresis, to avoid flapping).
  # 残量がこの%まで回復したらAnthropicへ切り戻す(フラッピング防止のヒステリシス)
  recovery_threshold_pct: 20.0
  # How often the background probe refreshes the quota reading (seconds).
  # バックグラウンドプローブがquotaを再取得する間隔(秒)
  probe_interval_seconds: 60.0
  # Read quota from the OAuth usage endpoint, which consumes none. It is the
  # endpoint Claude Code reads for its own /usage, and it also supplies the
  # reset time of each window. Subscription (OAuth) auth only: with an API key
  # the proxy falls back to the rate-limit headers of relayed responses, and to
  # the probe below while in fallback. Set false to never call it.
  # quotaを消費しないOAuth使用量エンドポイントから残量を読む。Claude Code自身が
  # /usage で参照しているエンドポイントで、各ウィンドウのリセット時刻もここから
  # 取得できる。サブスクリプション(OAuth)認証専用で、APIキー課金の場合は中継した
  # レスポンスのヘッダーに、フォールバック中は下記プローブに切り替わる。
  # 呼びたくない場合は false にする。
  use_usage_endpoint: true
  # Fallback probe, used only when the usage endpoint is unavailable AND we are
  # in fallback. Unlike the usage endpoint this does consume a little quota, so
  # keep max_tokens minimal.
  # 使用量エンドポイントが使えず、かつフォールバック中の場合にのみ使うプローブ。
  # 使用量エンドポイントと違いわずかにquotaを消費するため max_tokens は最小にする。
  probe_max_tokens: 1
  probe_model: claude-haiku-4-5-20251001

# Anthropic model name -> the Ollama Cloud model used during failover.
# The `target` value is sent verbatim as the "model" field of the Ollama API,
# so it must be exactly a tag listed on ollama.com/library (adding a custom
# suffix such as [1m] makes the model unresolvable and the request fails).
# Context lengths are noted in comments only; they are not part of the value.
# Every target MUST be a tool-calling model: Claude Code is an agent and cannot
# work with a model that does not support tool use. Verify with a probe request
# before adding one here (see docs/wsl-windows.md, "Choosing a fallback model").
#
# Anthropicのモデル名 -> フェイルオーバー時に使うOllama Cloud側のモデル名。
# target の値はOllama CloudのAPIへ "model" フィールドとしてそのまま送られるため、
# ollama.com/library に載っている正式なタグ名を過不足なく指定すること
# ([1m] 等の独自サフィックスを付けるとモデルが見つからずエラーになる)。
# コンテキスト長はコメントとして注記しておく(値には含めない)。
# target には必ずtool calling対応モデルを指定すること。Claude Codeはエージェントであり、
# ツール呼び出しができないモデルでは機能しない。追加前に実際にリクエストを投げて
# 確認すること(docs/wsl-windows.ja.md の「フォールバック先モデルの選定」を参照)。
model_mapping:
  default: glm-5.3-flash:cloud  # 1M tokens / 1Mトークン
  rules:
    - match: "claude-opus-*"
      target: glm-5.3-flash:cloud  # 1M tokens / 1Mトークン
    - match: "claude-sonnet-*"
      target: glm-5.3-flash:cloud  # 1M tokens / 1Mトークン
    - match: "claude-haiku-*"
      target: gemma4:31b-cloud  # 256K tokens / 256Kトークン

log_level: INFO
