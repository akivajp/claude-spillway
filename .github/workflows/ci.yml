name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # PyPI経由でWindowsユーザーも入れるため、両OSで検証する
    # Verify on both OSes, since PyPI users will install on Windows too
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest -v
