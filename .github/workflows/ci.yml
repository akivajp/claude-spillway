name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # PyPI経由でWindowsユーザーも入れるため、両OSで検証する
    # Verify on both OSes, since PyPI users will install on Windows too
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # setup-uv は v8 以降 v10 のような浮動メジャータグを publish していないため正確に指定する
        # setup-uv stopped publishing floating major tags after v7, so pin the exact release
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest -v
